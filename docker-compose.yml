name: ${COMPOSE_PROJECT_NAME:-peakflow_builder}

services:
  docker-server:
    image: docker:29.3.0-dind
    privileged: true
    devices:
      - /dev/kvm:/dev/kvm
    restart: always
    init: true
    shm_size: ${DOCKER_SERVER_SHM_SIZE:-2g}
    mem_limit: ${DOCKER_SERVER_MEMORY_LIMIT:-20g}
    memswap_limit: ${DOCKER_SERVER_MEMORY_LIMIT:-20g}
    stop_grace_period: 1m
    ports:
      - "${HOST_PORT:-8676}:${DOCKER_SERVER_TLS_PORT:-8676}"
    volumes:
      - ./shared:/shared
      - type: bind
        source: ${DOCKER_REGISTRY_CERTS_DIR:-./shared/docker-certs.d}
        target: /etc/docker/certs.d
        read_only: true
        bind:
          create_host_path: false
    ulimits:
      nofile:
        soft: ${DOCKER_SERVER_NOFILE_SOFT:-262144}
        hard: ${DOCKER_SERVER_NOFILE_HARD:-524288}
      nproc: ${DOCKER_SERVER_NPROC:-65535}
    command:
      - dockerd
      - --group
      - "1000"
      - --tlsverify
      - --tlscacert=/shared/certificates/tlscacert.pem
      - --tlscert=/shared/certificates/tlscert.pem
      - --tlskey=/shared/certificates/tlskey.pem
      - --host=unix:///var/run/docker.sock
      - --host=tcp://0.0.0.0:${DOCKER_SERVER_TLS_PORT:-8676}
      - --registry-mirror=http://${REGISTRY_CACHE_HOST:-registry-cache}:${REGISTRY_CACHE_PORT:-5000}
      - --insecure-registry=${REGISTRY_CACHE_HOST:-registry-cache}:${REGISTRY_CACHE_PORT:-5000}
    networks:
      peakflow-builder:
        ipv4_address: ${DOCKER_SERVER_IPV4_ADDRESS:-58.0.0.2}

  registry-cache:
    profiles:
      - registry-cache
    image: registry:3
    restart: unless-stopped
    environment:
      REGISTRY_PROXY_REMOTEURL: ${REGISTRY_PROXY_REMOTEURL:-https://registry-1.docker.io}
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_LOG_LEVEL: info
      REGISTRY_HTTP_ADDR: 0.0.0.0:${REGISTRY_CACHE_PORT:-5000}
      OTEL_TRACES_EXPORTER: none
    volumes:
      - ./registry-data:/var/lib/registry
    ports:
      - "${REGISTRY_CACHE_BIND:-127.0.0.1}:${REGISTRY_CACHE_BIND_PORT:-5000}:${REGISTRY_CACHE_PORT:-5000}"
    networks:
      peakflow-builder:
        ipv4_address: ${REGISTRY_CACHE_IPV4_ADDRESS:-58.0.0.3}

networks:
  peakflow-builder:
    driver: bridge
    ipam:
      config:
        - subnet: ${BUILDER_NETWORK_SUBNET:-58.0.0.0/24}
